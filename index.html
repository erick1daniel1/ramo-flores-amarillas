<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(#fefdfb, #fff3d6);
        }
        #ramo {
            display: flex;
            align-items: flex-end;
            position: relative;
            margin-bottom: 140px;
            animation: balanceo 4.5s ease-in-out infinite;
        }
        @keyframes balanceo {
            0%, 100% {
                rotate: -1.2deg;
            }
            50% {
                rotate: 1.2deg;
            }
        }
        .sombra-suelo {
            position: absolute;
            width: 210px;
            height: 26px;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.3), transparent 70%);
            filter: blur(3px);
            z-index: -7;
        }
        .envoltura-papel {
            position: absolute;
            width: 312px;
            height: 250px;
            top: -33px;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.22));
            z-index: -5;
            animation: latido 2.5s ease-in-out infinite;
        }
        @keyframes latido {
            0%, 100% {
                scale: 1;
            }
            10% {
                scale: 1.05;
            }
            20% {
                scale: 1;
            }
            30% {
                scale: 1.05;
            }
            40% {
                scale: 1;
            }
        }
        .liston {
            position: absolute;
            width: 150px;
            height: 36px;
            top: 88px;
            left: 50%;
            transform: translateX(-50%) rotate(-3deg);
            background: linear-gradient(180deg, #FFDE7A, #F2B705);
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.25);
            z-index: 1;
        }
        .moño-cola-izq, .moño-cola-der {
            position: absolute;
            width: 16px;
            height: 46px;
            top: 90px;
            left: 50%;
            background: linear-gradient(180deg, #FFDE7A, #E8A800);
            clip-path: polygon(0% 0%, 100% 0%, 100% 78%, 50% 100%, 0% 78%);
            z-index: 2;
        }
        .moño-cola-izq {
            transform: translateX(calc(-50% - 12px)) rotate(-16deg);
            transform-origin: 50% 0%;
        }
        .moño-cola-der {
            transform: translateX(calc(-50% + 12px)) rotate(16deg);
            transform-origin: 50% 0%;
        }
        .moño-ala-izq, .moño-ala-der {
            position: absolute;
            width: 50px;
            height: 20px;
            top: 85px;
            left: 50%;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFE58A, #F2B705);
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.2);
            z-index: 3;
        }
        .moño-ala-izq {
            transform: translateX(calc(-50% - 24px)) rotate(-22deg);
        }
        .moño-ala-der {
            transform: translateX(calc(-50% + 24px)) rotate(22deg);
        }
        .moño-nudo {
            position: absolute;
            width: 20px;
            height: 20px;
            top: 79px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            background: linear-gradient(160deg, #FFE58A, #E8A800);
            border-radius: 4px;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
            z-index: 4;
        }
        .hoja {
            position: absolute;
            width: 30px;
            height: 100px;
            bottom: 0;
            left: 50%;
            transform-origin: 50% 100%;
        }
        .hoja-1 {
            transform: translateX(110px) translateY(10px) rotate(50deg);
            z-index: -3;
        }
        .hoja-2 {
            transform: translateX(55px) translateY(-25px) rotate(35deg);
            z-index: -2;
        }
        .hoja-3 {
            transform: translateX(0px) translateY(-40px) rotate(0deg);
            z-index: -1;
        }
        .hoja-4 {
            transform: translateX(-55px) translateY(-25px) rotate(-35deg);
            z-index: -2;
        }
        .hoja-5 {
            transform: translateX(-110px) translateY(10px) rotate(-50deg);
            z-index: -3;
        }
        .flor {
            position: relative;
            width: 100px;
            height: 100px;
            margin: -15px;
            filter: drop-shadow(0px 0px 5px rgba(0, 0, 0, 0.16));
            animation-name: abrirFlor;
            animation-duration: 0.7s;
            animation-timing-function: ease-out;
            animation-fill-mode: both;
        }
        .flor-1 {
            transform: translateY(0px) rotate(-25deg);
            animation-delay: 0s;
        }
        .flor-2 {
            transform: translateY(-20px) rotate(-15deg);
            animation-delay: 0.15s;
        }
        .flor-3 {
            transform: translateY(-40px) rotate(0deg);
            animation-delay: 0.3s;
        }
        .flor-4 {
            transform: translateY(-20px) rotate(15deg);
            animation-delay: 0.45s;
        }
        .flor-5 {
            transform: translateY(0px) rotate(25deg);
            animation-delay: 0.6s;
        }
        @keyframes abrirFlor {
            0% {
                opacity: 0;
                scale: 0;
            }
            80% {
                opacity: 1;
                scale: 1.1;
            }
            100% {
                opacity: 1;
                scale: 1;
            }
        }
        .tallo {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            overflow: visible;
        }
        .flor-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
        }
        #btn-reiniciar {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            box-shadow: 0px 3px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            transition: transform 0.2s ease;
        }
        #btn-reiniciar:hover {
            transform: rotate(90deg);
        }
        #btn-abrir {
            padding: 0.85rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            color: #1d1d1f;
            background: #ffffff;
            border: none;
            border-radius: 999px;
            box-shadow: 0px 4px 14px rgba(0, 0, 0, 0.12);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #btn-abrir:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 18px rgba(0, 0, 0, 0.16);
        }
        #etiqueta-para {
            position: relative;
            z-index: 10;
            font-size: 1.05rem;
            font-weight: 700;
            color: #8A2846;
            background: #fffdf8;
            padding: 0.5rem 1.4rem;
            border-radius: 999px;
            border: 2px dashed #F2B705;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            rotate: -3deg;
            margin-bottom: 0.5rem;
            top: -50px;
        }
        #mensaje {
            opacity: 0;
            transition: opacity 0.5s;
            font-size: 1.1rem;
            color: #1d1d1f;
            max-width: 320px;
            text-align: center;
            line-height: 1.5;
            padding: 0 1rem;
        }
        #mensaje.visible {
            opacity: 1;
        }
        .confeti {
            position: fixed;
            top: -14px;
            width: 14px;
            height: 12px;
            z-index: 999;
            pointer-events: none;
            clip-path: path("M7,12 C7,12 1,7 1,3.5 C1,1.5 2.3,0 4.2,0 C5.6,0 6.6,1 7,2 C7.4,1 8.4,0 9.8,0 C11.7,0 13,1.5 13,3.5 C13,7 7,12 7,12 Z");
            animation-name: caer-confeti;
            animation-timing-function: ease-in;
            animation-fill-mode: forwards;
        }
        @keyframes caer-confeti {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        #pato {
            position: fixed;
            bottom: 30px;
            left: -160px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }
        #pato.caminando {
            animation: caminar-pato 3.5s ease-in-out forwards;
        }
        @keyframes caminar-pato {
            0% {
                left: -160px;
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            10% {
                transform: translateY(-8px) rotate(-4deg);
            }
            20% {
                transform: translateY(0) rotate(0deg);
            }
            30% {
                transform: translateY(-8px) rotate(4deg);
            }
            40% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                left: 45vw;
                transform: translateY(-8px) rotate(-4deg);
            }
            60% {
                transform: translateY(0) rotate(0deg);
            }
            70% {
                transform: translateY(-8px) rotate(4deg);
            }
            80% {
                transform: translateY(0) rotate(0deg);
            }
            95% {
                opacity: 1;
            }
            100% {
                left: 110vw;
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
        }
    </style>
</head>

            <use href="#petalo-largo" transform="rotate(288)" />
            <circle r="10" fill="url(#centro-grad)" />
        </g>
    </svg>
    <button id="btn-abrir">Toca aquí, Mochito 🌸</button>
    <div id="mensaje"></div>

    <script>
        const BtnAbrir = document.getElementById("btn-abrir");
        const mensaje = "Feliz Inicio de primavera Mochito ❤️";

        document.getElementById("btn-reiniciar").addEventListener("click", function() {
            location.reload();
        });

        function lanzarConfeti() {
            const colores = ["#FFD60A", "#FF9500", "#6B8E4E", "#FFFFFF", "#E8A33D"];
            for (let i = 0; i < 60; i++) {
                const pieza = document.createElement("div");
                pieza.classList.add("confeti");
                pieza.style.left = Math.random() * 100 + "vw";
                pieza.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                pieza.style.animationDuration = (2 + Math.random() * 1.5) + "s";
                pieza.style.animationDelay = (Math.random() * 0.4) + "s";
                document.body.appendChild(pieza);
                setTimeout(() => pieza.remove(), 4000);
            }
        }

        function reiniciarAnimacion(elemento) {
            elemento.style.animation = "none";
            void elemento.offsetWidth;
            elemento.style.animation = "";
        }

        BtnAbrir.addEventListener("click", function() {
            BtnAbrir.style.display = "none";
            const Mensaje = document.getElementById("mensaje");
            Mensaje.classList.add("visible");

            document.querySelectorAll(".flor").forEach(reiniciarAnimacion);
            lanzarConfeti();

            const Pato = document.getElementById("pato");
            Pato.classList.add("caminando");

            const letras = Array.from(mensaje);
            let i = 0;
            const intervalo = setInterval(() => {
                Mensaje.textContent += letras[i];
                i++;
                if (i >= letras.length) {
                    clearInterval(intervalo);
                }
            }, 60);
        });
    </script>
</body>
</html>
